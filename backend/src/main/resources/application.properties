spring.application.name=sevaconnect

# ---- Database (env vars override the local defaults) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sevaconnect}
spring.datasource.username=postgres
spring.datasource.password=jfdkf
spring.datasource.hikari.maximum-pool-size=5

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Server ----
server.port=${PORT:8080}
server.error.include-message=always

# ---- CORS: comma separated list of allowed frontend origins ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
